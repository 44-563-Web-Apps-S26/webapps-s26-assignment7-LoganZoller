<script>
    let ids=["Image1", "Image2", "Image3", "Image4", "Image5","Image6", "Image7", 
        "Image8", "Image9", "Image10", "Image11", "Image12", "Image13", "Image14",
        "Image15", "Image16", "Image17", "Image18", "Image19", "Image20", "Image21",
        "Image22", "Image23", "Image24", "Image25", "Image26", "Image27", "Image28", 
        "Image29", "Image30", "Image31", "Image32", "Image33", "Image34", "Image35"];

    let score = 0
    let locationsVisited = 0
    let lastLocation = 0
    let statueLocation = 19
    let toucanLocation = 14
    let lorikeetLocations = [3, 25]
    let buntingLocations = [2, 5, 11, 20, 21]
    let gameOver = false

    function check(position) {
        if (gameOver) {
            return
        }

        let id = ids[position]
        let image = document.getElementById(id)
        
        locationsVisited++

        if (position == statueLocation) {
            image.src = "statue.jpg"
            gameOver = true
            score -= 3
            image.onclick = null
        }

        else if (position == toucanLocation) {
            image.src = "toucan.jpg"
            score += 5
            image.onclick = null
        }

        else if (lorikeetLocations.includes(position)) {
            image.src = "lorikeet.jpg"
            score += 3
            image.onclick = null
        }

        else if (buntingLocations.includes(position)) {
            image.src = "bunting.jpg"
            score += 1
            image.onclick = null
        }
        
        lastLocation = position
        document.getElementById("score").innerHTML = "Score is " + score
        document.getElementById("locations").innerHTML = "Number of locations checked is " + locationsVisited
    }

    function help() {
        let result = "silence"

        let left = (lastLocation - 1 + 35) % 35
        let right = (lastLocation + 1) % 35
        let up = (lastLocation - 7 + 35) % 35
        let down = (lastLocation + 7) % 35

        let buntingNeighbors = [left, right, up, down]

        for (let n of buntingNeighbors) {
            if (buntingLocations.includes(n)) {
                result = "cheep"
            }
        }

        let sameLocation = (lastLocation)
        let leftUpDiagonal = (lastLocation - 8)
        let above = (lastLocation - 7)
        let rightUpDiagonal = (lastLocation - 6)
        let leftSide = (lastLocation - 1)
        let rightSide = (lastLocation + 1)
        let bottomLeftDiagonal = (lastLocation + 6)
        let bottom = (lastLocation + 7)
        let bottomRightDiagonal = (lastLocation + 8)

        let toucanNeighbors = [sameLocation, leftUpDiagonal, above, rightUpDiagonal, 
            leftSide, rightSide, bottomLeftDiagonal, bottom, bottomRightDiagonal]
        
        for (let n of toucanNeighbors) {
            if (toucanLocation == n) {
                result = "caw"
            }
        }

        for (let n of toucanNeighbors) {
            if (statueLocation == n) {
                result = "thrrum"
            }
        }
        document.getElementById("help").innerHTML = result

    }

</script>
